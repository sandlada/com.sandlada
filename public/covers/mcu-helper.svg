<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Glowing dynamic color token ring for the MCU Helper engine">
  <!-- MCU Helper · frosted glow style · lime -->
  <defs>
    <linearGradient id="mcu-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#eaf6e2"/>
      <stop offset="1" stop-color="#c9e7b8"/>
    </linearGradient>
    <radialGradient id="mcu-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8fd67a" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#8fd67a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="mcu-dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="3" fill="#4da63a" opacity="0.12"/>
    </pattern>
    <filter id="mcu-soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="45"/>
    </filter>
    <filter id="mcu-halo" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#4da63a" flood-opacity="0.8"/>
    </filter>
    <filter id="mcu-dream" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
  </defs>

  <rect width="800" height="400" fill="url(#mcu-bg)"/>
  <ellipse cx="395" cy="205" rx="270" ry="150" fill="#8fd67a" opacity="0.55" filter="url(#mcu-soft)"/>
  <circle cx="150" cy="80" r="130" fill="url(#mcu-glow)"/>
  <rect x="0" y="0" width="240" height="150" fill="url(#mcu-dots)"/>

  <g filter="url(#mcu-halo)">
    <g filter="url(#mcu-dream)">
      <circle cx="400" cy="200" r="80" fill="none" stroke="#ffffff" stroke-width="30"/>
      <circle cx="400" cy="200" r="18" fill="#ffffff"/>
      <circle cx="400" cy="280" r="13" fill="#4da63a"/>
      <circle cx="476" cy="175" r="13" fill="#4da63a"/>
      <circle cx="447" cy="265" r="13" fill="#4da63a"/>
      <circle cx="353" cy="265" r="13" fill="#4da63a"/>
      <circle cx="324" cy="175" r="13" fill="#4da63a"/>
    </g>
  </g>
</svg>
