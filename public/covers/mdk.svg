<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Glowing shape and data nodes for the MDK data library">
  <!-- MDK · frosted glow style · teal -->
  <defs>
    <linearGradient id="mdk-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#e2f4f0"/>
      <stop offset="1" stop-color="#bfe6db"/>
    </linearGradient>
    <radialGradient id="mdk-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#62c9b4" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#62c9b4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="mdk-dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="3" fill="#1f9e86" opacity="0.12"/>
    </pattern>
    <filter id="mdk-soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="45"/>
    </filter>
    <filter id="mdk-halo" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#1f9e86" flood-opacity="0.8"/>
    </filter>
    <filter id="mdk-dream" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
  </defs>

  <rect width="800" height="400" fill="url(#mdk-bg)"/>
  <ellipse cx="390" cy="200" rx="270" ry="150" fill="#62c9b4" opacity="0.55" filter="url(#mdk-soft)"/>
  <circle cx="150" cy="320" r="130" fill="url(#mdk-glow)"/>
  <rect x="0" y="250" width="240" height="150" fill="url(#mdk-dots)"/>

  <g filter="url(#mdk-halo)">
    <g filter="url(#mdk-dream)">
      <rect x="316" y="116" width="168" height="168" rx="52" fill="none" stroke="#ffffff" stroke-width="28"/>
      <circle cx="400" cy="200" r="24" fill="#ffffff"/>
      <circle cx="522" cy="118" r="13" fill="#ffffff"/>
      <circle cx="272" cy="288" r="13" fill="#ffffff"/>
    </g>
  </g>
</svg>
