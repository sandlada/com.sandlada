<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Glowing terminal prompt for the Material Theme CLI">
  <!-- Material Theme CLI · frosted glow style · periwinkle -->
  <defs>
    <linearGradient id="cli-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#e9eefb"/>
      <stop offset="1" stop-color="#c6d4f1"/>
    </linearGradient>
    <radialGradient id="cli-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7d9bf0" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#7d9bf0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="cli-dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="3" fill="#4465d1" opacity="0.12"/>
    </pattern>
    <filter id="cli-soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="45"/>
    </filter>
    <filter id="cli-halo" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#4465d1" flood-opacity="0.8"/>
    </filter>
    <filter id="cli-dream" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
  </defs>

  <rect width="800" height="400" fill="url(#cli-bg)"/>
  <ellipse cx="400" cy="200" rx="270" ry="150" fill="#7d9bf0" opacity="0.55" filter="url(#cli-soft)"/>
  <circle cx="150" cy="320" r="130" fill="url(#cli-glow)"/>
  <rect x="0" y="250" width="240" height="150" fill="url(#cli-dots)"/>

  <g filter="url(#cli-halo)">
    <g filter="url(#cli-dream)" fill="none" stroke="#ffffff" stroke-width="32" stroke-linecap="round" stroke-linejoin="round">
      <path d="M352 152 L412 200 L352 248"/>
      <path d="M440 248 H500"/>
    </g>
  </g>
</svg>
