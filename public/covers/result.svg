<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Glowing check ring for the Result error-handling library">
  <!-- Result · frosted glow style · green -->
  <defs>
    <linearGradient id="result-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#e6f4e6"/>
      <stop offset="1" stop-color="#c2e6c2"/>
    </linearGradient>
    <radialGradient id="result-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6fce85" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#6fce85" stop-opacity="0"/>
    </radialGradient>
    <pattern id="result-dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="3" fill="#2f9e4f" opacity="0.12"/>
    </pattern>
    <filter id="result-soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="45"/>
    </filter>
    <filter id="result-halo" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#2f9e4f" flood-opacity="0.8"/>
    </filter>
    <filter id="result-dream" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
  </defs>

  <rect width="800" height="400" fill="url(#result-bg)"/>
  <ellipse cx="405" cy="200" rx="270" ry="150" fill="#6fce85" opacity="0.55" filter="url(#result-soft)"/>
  <circle cx="655" cy="315" r="130" fill="url(#result-glow)"/>
  <rect x="560" y="250" width="240" height="150" fill="url(#result-dots)"/>

  <g filter="url(#result-halo)">
    <g filter="url(#result-dream)" fill="none" stroke="#ffffff" stroke-width="30" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="400" cy="200" r="82"/>
      <path d="M362 200 l26 26 l54 -64"/>
    </g>
  </g>
</svg>
