<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Glowing ascending bars for the Breakpoint observer library">
  <!-- Breakpoint · frosted glow style · indigo -->
  <defs>
    <linearGradient id="bp-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#e8ebfb"/>
      <stop offset="1" stop-color="#c7d1f4"/>
    </linearGradient>
    <radialGradient id="bp-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b9cf0" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#8b9cf0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="bp-dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="3" fill="#4d5fd0" opacity="0.12"/>
    </pattern>
    <filter id="bp-soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="45"/>
    </filter>
    <filter id="bp-halo" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#4d5fd0" flood-opacity="0.8"/>
    </filter>
    <filter id="bp-dream" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
  </defs>

  <rect width="800" height="400" fill="url(#bp-bg)"/>
  <ellipse cx="395" cy="210" rx="270" ry="150" fill="#8b9cf0" opacity="0.55" filter="url(#bp-soft)"/>
  <circle cx="145" cy="85" r="130" fill="url(#bp-glow)"/>
  <rect x="0" y="0" width="240" height="150" fill="url(#bp-dots)"/>

  <g filter="url(#bp-halo)">
    <g filter="url(#bp-dream)" stroke="#ffffff" stroke-width="46" stroke-linecap="round">
      <line x1="340" y1="232" x2="340" y2="272"/>
      <line x1="400" y1="200" x2="400" y2="272"/>
      <line x1="460" y1="168" x2="460" y2="272"/>
    </g>
    <g filter="url(#bp-dream)">
      <circle cx="340" cy="188" r="12" fill="#ffffff"/>
    </g>
  </g>
</svg>
