<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Glowing OKYCT wordmark">
  <!--
    OKYCT product cover · 800×400
    Same capture language as the other covers: a soft-focus wordmark floating on a
    pale blue field. The card grid hue-rotates the blue into the theme greens, so
    the asset is authored in the blue capture palette on purpose.
  -->
  <defs>
    <linearGradient id="okyct-bg" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="0.55" stop-color="#e4eefc"/>
      <stop offset="1" stop-color="#cadcf8"/>
    </linearGradient>
    <radialGradient id="okyct-halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#b9d5fb" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#b9d5fb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="okyct-sheen" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="okyct-shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <filter id="okyct-bloom" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="okyct-core" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
  </defs>

  <rect width="800" height="400" fill="url(#okyct-bg)"/>
  <ellipse cx="330" cy="120" rx="280" ry="190" fill="url(#okyct-sheen)"/>
  <ellipse cx="470" cy="236" rx="330" ry="180" fill="url(#okyct-halo)"/>

  <g transform="rotate(-9 400 200)" font-family="'Google Sans Flex', 'Segoe UI', system-ui, sans-serif">
    <text
      x="400"
      y="256"
      text-anchor="middle"
      font-size="164"
      font-weight="700"
      letter-spacing="6"
      fill="#17408a"
      opacity="0.32"
      filter="url(#okyct-shadow)"
    >OKYCT</text>
    <text
      x="400"
      y="250"
      text-anchor="middle"
      font-size="164"
      font-weight="700"
      letter-spacing="6"
      fill="#2f6fdd"
      filter="url(#okyct-bloom)"
    >OKYCT</text>
    <text
      x="400"
      y="250"
      text-anchor="middle"
      font-size="164"
      font-weight="700"
      letter-spacing="6"
      fill="#ffffff"
      filter="url(#okyct-core)"
    >OKYCT</text>
  </g>
</svg>
