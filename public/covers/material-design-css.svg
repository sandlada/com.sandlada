<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Glowing style braces for the Material Design CSS token package">
  <!-- Material Design CSS · frosted glow style · violet -->
  <defs>
    <linearGradient id="mdcss-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#efe9fb"/>
      <stop offset="1" stop-color="#d7c9f2"/>
    </linearGradient>
    <radialGradient id="mdcss-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#b39df2" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#b39df2" stop-opacity="0"/>
    </radialGradient>
    <pattern id="mdcss-dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="3" fill="#7c5cd6" opacity="0.12"/>
    </pattern>
    <filter id="mdcss-soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="45"/>
    </filter>
    <filter id="mdcss-halo" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#7c5cd6" flood-opacity="0.8"/>
    </filter>
    <filter id="mdcss-dream" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
  </defs>

  <rect width="800" height="400" fill="url(#mdcss-bg)"/>
  <ellipse cx="400" cy="205" rx="270" ry="150" fill="#b39df2" opacity="0.55" filter="url(#mdcss-soft)"/>
  <circle cx="650" cy="80" r="130" fill="url(#mdcss-glow)"/>
  <rect x="560" y="0" width="240" height="150" fill="url(#mdcss-dots)"/>

  <g filter="url(#mdcss-halo)">
    <g filter="url(#mdcss-dream)" fill="none" stroke="#ffffff" stroke-width="30" stroke-linecap="round">
      <path d="M452 108 Q402 108 402 152 L402 174 Q402 196 380 200 Q402 204 402 226 L402 248 Q402 292 452 292"/>
      <g transform="translate(800 0) scale(-1 1)">
        <path d="M452 108 Q402 108 402 152 L402 174 Q402 196 380 200 Q402 204 402 226 L402 248 Q402 292 452 292"/>
      </g>
    </g>
  </g>
</svg>
