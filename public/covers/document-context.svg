<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Glowing anchored document node for the Document Context library">
  <!-- Document Context · frosted glow style · sky -->
  <defs>
    <linearGradient id="dc-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#e5f2fc"/>
      <stop offset="1" stop-color="#bfdaf5"/>
    </linearGradient>
    <radialGradient id="dc-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6fb3ec" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#6fb3ec" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dc-dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="3" fill="#2f7fc4" opacity="0.12"/>
    </pattern>
    <filter id="dc-soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="45"/>
    </filter>
    <filter id="dc-halo" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#2f7fc4" flood-opacity="0.8"/>
    </filter>
    <filter id="dc-dream" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
  </defs>

  <rect width="800" height="400" fill="url(#dc-bg)"/>
  <ellipse cx="400" cy="200" rx="270" ry="150" fill="#6fb3ec" opacity="0.55" filter="url(#dc-soft)"/>
  <circle cx="650" cy="320" r="130" fill="url(#dc-glow)"/>
  <rect x="560" y="250" width="240" height="150" fill="url(#dc-dots)"/>

  <g filter="url(#dc-halo)">
    <g filter="url(#dc-dream)">
      <rect x="296" y="126" width="208" height="148" rx="26" fill="none" stroke="#ffffff" stroke-width="28"/>
      <circle cx="400" cy="200" r="40" fill="none" stroke="#ffffff" stroke-width="9" opacity="0.85"/>
      <circle cx="400" cy="200" r="16" fill="#ffffff"/>
      <line x1="496" y1="138" x2="550" y2="110" stroke="#ffffff" stroke-width="14" stroke-linecap="round"/>
      <circle cx="560" cy="105" r="12" fill="#ffffff"/>
    </g>
  </g>
</svg>
