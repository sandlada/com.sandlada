<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Glowing RopSharp wordmark">
  <!--
    RopSharp product cover · 800×400
    Same capture language as the other covers: a soft-focus wordmark floating on a
    pale blue field. The card grid hue-rotates the blue into the theme greens, so
    the asset is authored in the blue capture palette on purpose.
  -->
  <defs>
    <linearGradient id="rop-bg" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="0.55" stop-color="#e3edfc"/>
      <stop offset="1" stop-color="#c7daf8"/>
    </linearGradient>
    <radialGradient id="rop-halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#b3d1fb" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#b3d1fb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rop-sheen" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="rop-shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="rop-bloom" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="rop-core" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
  </defs>

  <rect width="800" height="400" fill="url(#rop-bg)"/>
  <ellipse cx="300" cy="112" rx="270" ry="180" fill="url(#rop-sheen)"/>
  <ellipse cx="500" cy="248" rx="330" ry="180" fill="url(#rop-halo)"/>

  <g transform="rotate(-13 400 200)" font-family="'Google Sans Flex', 'Segoe UI', system-ui, sans-serif">
    <text
      x="400"
      y="246"
      text-anchor="middle"
      font-size="112"
      font-weight="700"
      letter-spacing="1"
      fill="#17408a"
      opacity="0.3"
      filter="url(#rop-shadow)"
    >RopSharp</text>
    <text
      x="400"
      y="240"
      text-anchor="middle"
      font-size="112"
      font-weight="700"
      letter-spacing="1"
      fill="#2f6fdd"
      filter="url(#rop-bloom)"
    >RopSharp</text>
    <text
      x="400"
      y="240"
      text-anchor="middle"
      font-size="112"
      font-weight="700"
      letter-spacing="1"
      fill="#ffffff"
      filter="url(#rop-core)"
    >RopSharp</text>
  </g>
</svg>
