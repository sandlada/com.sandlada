<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Glowing terminal cell grid for the OpenCode Material theme">
  <!-- OpenCode Material Theme · frosted glow style · cyan -->
  <defs>
    <linearGradient id="oc-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#e3f5f6"/>
      <stop offset="1" stop-color="#bae6ea"/>
    </linearGradient>
    <radialGradient id="oc-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#57c5cf" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#57c5cf" stop-opacity="0"/>
    </radialGradient>
    <pattern id="oc-dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="3" fill="#1f9aa5" opacity="0.12"/>
    </pattern>
    <filter id="oc-soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="45"/>
    </filter>
    <filter id="oc-halo" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#1f9aa5" flood-opacity="0.8"/>
    </filter>
    <filter id="oc-dream" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
  </defs>

  <rect width="800" height="400" fill="url(#oc-bg)"/>
  <ellipse cx="400" cy="205" rx="270" ry="150" fill="#57c5cf" opacity="0.55" filter="url(#oc-soft)"/>
  <circle cx="150" cy="85" r="130" fill="url(#oc-glow)"/>
  <rect x="0" y="0" width="240" height="150" fill="url(#oc-dots)"/>

  <g filter="url(#oc-halo)">
    <g filter="url(#oc-dream)">
      <g fill="none" stroke="#ffffff" stroke-width="20">
        <rect x="284" y="138" width="64" height="64" rx="18"/>
        <rect x="368" y="138" width="64" height="64" rx="18"/>
        <rect x="452" y="138" width="64" height="64" rx="18"/>
        <rect x="284" y="222" width="64" height="64" rx="18"/>
        <rect x="452" y="222" width="64" height="64" rx="18"/>
      </g>
      <rect x="368" y="222" width="64" height="64" rx="18" fill="#1f9aa5"/>
    </g>
  </g>
</svg>
